name: Responsive QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: responsive-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Run release QA
        run: npm run qa

      - name: Upload responsive failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-failures
          path: output/responsive-qa
          if-no-files-found: ignore
          retention-days: 7
